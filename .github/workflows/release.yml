name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (AMD64)
          - os: ubuntu-latest
            target: linux-amd64
            artifact_name: gitget-linux-amd64
            binary_name: gitget
            setup: |
              sudo apt-get update
              sudo apt-get install -y clang libcurl4-openssl-dev make
            build_cmd: |
              make clean
              make CXX=clang++
              mv gitget gitget-linux-amd64

          # Linux ARM64 (Native GitHub ARM64 Runner - Termux / Android / Pi)
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact_name: gitget-linux-arm64
            binary_name: gitget
            setup: |
              sudo apt-get update
              sudo apt-get install -y clang libcurl4-openssl-dev make
            build_cmd: |
              make clean
              make CXX=clang++
              mv gitget gitget-linux-arm64

          # Windows x86_64 (MSYS2 MinGW-w64)
          - os: windows-latest
            target: windows-amd64
            artifact_name: gitget-windows-amd64.exe
            binary_name: gitget.exe
            use_msys: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment (Linux)
        if: ${{ !matrix.use_msys }}
        run: ${{ matrix.setup }}

      - name: Build binary (Linux with Clang)
        if: ${{ !matrix.use_msys }}
        run: ${{ matrix.build_cmd }}

      - name: Setup MSYS2 (Windows)
        if: matrix.use_msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-curl
            make

      - name: Build binary (Windows with Clang)
        if: matrix.use_msys
        shell: msys2 {0}
        run: |
          make clean
          make CXX=clang++ TARGET=gitget.exe LDFLAGS="$(curl-config --libs) -static"
          mv gitget.exe gitget-windows-amd64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          chmod +x gitget-linux-* 2>/dev/null || true
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
