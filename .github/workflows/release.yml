name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (AMD64)
          - os: ubuntu-latest
            target: linux-amd64
            artifact_name: gitget-linux-amd64
            binary_name: gitget
            setup: |
              sudo apt-get update
              sudo apt-get install -y libcurl4-openssl-dev build-essential
            build_cmd: |
              make clean
              make
              mv gitget gitget-linux-amd64

          # Linux ARM64 / Termux (aarch64 cross-compile)
          - os: ubuntu-latest
            target: linux-arm64
            artifact_name: gitget-linux-arm64
            binary_name: gitget
            setup: |
              sudo dpkg --add-architecture arm64
              sudo apt-get update
              sudo apt-get install -y g++-aarch64-linux-gnu binutils-aarch64-linux-gnu libcurl4-openssl-dev:arm64
            build_cmd: |
              make clean
              make CXX=aarch64-linux-gnu-g++ \
                   CURL_CFLAGS="$(pkg-config --cflags libcurl-arm64 2>/dev/null || aarch64-linux-gnu-pkg-config --cflags libcurl 2>/dev/null || echo '-I/usr/include/aarch64-linux-gnu')" \
                   CURL_LIBS="-lcurl"
              mv gitget gitget-linux-arm64

          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            target: macos-arm64
            artifact_name: gitget-macos-arm64
            binary_name: gitget
            setup: |
              brew install curl
            build_cmd: |
              make clean
              CURL_PREFIX=$(brew --prefix curl)
              make CURL_CFLAGS="-I$CURL_PREFIX/include" CURL_LIBS="-L$CURL_PREFIX/lib -lcurl"
              mv gitget gitget-macos-arm64

          # macOS x86_64 (Intel)
          - os: macos-13
            target: macos-amd64
            artifact_name: gitget-macos-amd64
            binary_name: gitget
            setup: |
              brew install curl
            build_cmd: |
              make clean
              CURL_PREFIX=$(brew --prefix curl)
              make CURL_CFLAGS="-I$CURL_PREFIX/include" CURL_LIBS="-L$CURL_PREFIX/lib -lcurl"
              mv gitget gitget-macos-amd64

          # Windows x86_64 (MSYS2 MinGW-w64)
          - os: windows-latest
            target: windows-amd64
            artifact_name: gitget-windows-amd64.exe
            binary_name: gitget.exe
            setup: |
              echo "MSYS2 environment configured"
            use_msys: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment (Unix)
        if: ${{ !matrix.use_msys }}
        run: ${{ matrix.setup }}

      - name: Build binary (Unix)
        if: ${{ !matrix.use_msys }}
        run: ${{ matrix.build_cmd }}

      - name: Setup MSYS2 (Windows)
        if: matrix.use_msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-curl

      - name: Build binary (Windows)
        if: matrix.use_msys
        shell: msys2 {0}
        run: |
          make clean
          make TARGET=gitget.exe LDFLAGS="$(curl-config --libs) -static-libgcc -static-libstdc++"
          mv gitget.exe gitget-windows-amd64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          chmod +x gitget-linux-* gitget-macos-* 2>/dev/null || true
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
